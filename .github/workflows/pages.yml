name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Construir para GitHub Pages
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /aquapuel
      - name: Preparar recursos para la ruta del proyecto
        run: |
          mv dist/client/aquapuel/_next dist/client/_next
          rmdir dist/client/aquapuel
          touch dist/client/.nojekyll
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
