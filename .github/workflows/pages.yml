name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar formulario del servidor
        run: php -l public/api/contact.php && php tests/contact.php

      - name: Revisar código y formato
        run: npm run lint && npm run format:check

      - name: Revisar dependencias vulnerables
        run: npm audit --audit-level=high

      - name: Construir para GitHub Pages
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /aquapuel
      - name: Preparar recursos para la ruta del proyecto
        run: |
          mv dist/client/aquapuel/_next dist/client/_next
          rmdir dist/client/aquapuel
          touch dist/client/.nojekyll
          rm -rf dist/client/api
      - name: Preparar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
