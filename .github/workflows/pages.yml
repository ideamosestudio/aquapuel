name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar formulario del servidor
        run: php -l public/api/contact.php && php tests/contact.php

      - name: Revisar código y formato
        run: npm run lint && npm run format:check

      - name: Revisar dependencias vulnerables
        run: npm audit --audit-level=moderate

      - name: Construir para GitHub Pages
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /aquapuel
      - name: Preparar recursos para la ruta del proyecto
        run: |
          mv dist/client/aquapuel/_next dist/client/_next
          rmdir dist/client/aquapuel
          touch dist/client/.nojekyll
          rm -rf dist/client/api
      - name: Preparar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
