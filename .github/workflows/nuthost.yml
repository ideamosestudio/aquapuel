name: Preparar web para cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preparar-cpanel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código y formato
        run: npm run lint && npm run format:check

      - name: Revisar dependencias vulnerables
        run: npm audit --audit-level=high

      - name: Construir para aquapuel.com
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      - name: Preparar archivos para cPanel
        run: |
          test -s dist/client/index.html
          mkdir -p cpanel-output/site
          cp -a dist/client/. cpanel-output/site/
          cat > cpanel-output/.cpanel.yml <<'YAML'
          ---
          deployment:
            tasks:
              - /bin/cp -R site/. /home5/aquapuel/public_html/
          YAML

      - name: Guardar la web compilada en GitHub
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cpanel-deploy
          publish_dir: ./cpanel-output
